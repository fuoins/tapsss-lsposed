plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tapsss.lsposed'
    compileSdk 33
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId "com.tapsss.lsposed"
        minSdk 21
        targetSdk 33
        versionCode 18
        versionName "1.0.17"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Xposed API，仅编译期使用；运行时由 LSPosed 提供
    compileOnly 'de.robv.android.xposed:api:82'
}
